apiVersion: v1
kind: Pod

metadata:
  name: nginx
  namespace: default

labels:
  app: nginx

status:
  phase: Running

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: ruoyi
  namespace: ruoyi

replicas: 3

---
apiVersion: apps/v1
kind: ReplicaSet

metadata:
  name: nginx-replicaset
  namespace: default

replicas: 3

selector:
  matchLabels:
    app: nginx

template:
  metadata:
    name: nginx
    namespace: default
    labels:
      app: nginx